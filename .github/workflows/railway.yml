name: Lulu Card demo checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsx scripts/check_worlds_cards.ts
      - run: npx tsx scripts/check_removed_cards.ts
      - run: npx tsx scripts/check_echo_series.ts
      - run: node scripts/check_echo_quiz_server.mjs
      - run: npx tsx scripts/check_team_lineage.ts
      - run: npx tsx scripts/check_region_chemistry.ts
      - run: npx tsx scripts/check_dashboard.ts
      - run: npx tsx scripts/check_mailbox.ts
      - run: node scripts/check_admin_guard.mjs
      - run: node scripts/check_formal_phone_gate.mjs
      - run: node scripts/check_admin_metrics.mjs
      - run: node scripts/check_market_policy.mjs
      - run: npx tsx scripts/check_market_pair.ts
      - run: npx tsx scripts/check_challenge_search.ts
      - run: npx tsx scripts/check_display_text.ts
      - run: node scripts/check_puzzle_delivery.mjs
      - run: npx tsx scripts/check_lol_match.ts
      - run: npx tsx scripts/check_lol_modes.ts
      - run: npx tsx scripts/check_cup_registration.ts

      - run: npx tsx scripts/check_mythic_floor.ts
      - run: npx tsx scripts/check_weekly_series.ts
      - run: npx tsx scripts/check_account_unknown.ts
      - run: npx tsx scripts/check_minigame.ts
      - run: npx tsx scripts/check_minigame_rewards.ts
      - run: npx tsx scripts/check_arena_rosters.ts
      - run: npx tsx scripts/check_game_regions.ts
      - run: npx tsx scripts/check_swap_regrade.ts
      - run: npx tsx scripts/check_card_rarity.ts
      - run: npx tsx scripts/check_arena_card_scale.ts
      - run: npx tsx scripts/check_series.ts
